[workspace]
resolver = "2"
members = ["cli", "crates/clip-core", "crates/clip-store", "crates/clip-sync", "server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Clip"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
clip-core = { path = "crates/clip-core" }

# Smaller, faster release binaries — matters for a always-resident tray app.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
