[package]
name = "carryall"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Carryall — lightweight clipboard daemon with E2E cross-device sync."

[[bin]]
name = "carryall"
path = "src/main.rs"

[dependencies]
clip-core = { workspace = true }
clip-store = { path = "../crates/clip-store" }
clip-sync = { path = "../crates/clip-sync" }
serde_json = { workspace = true }

# Native clipboard read/write + change monitoring (X11/Win/macOS).
clipboard-rs = "0.3"
# async sync client
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
dirs = "5"
base64 = "0.22"
# LAN peer auto-discovery (zeroconf/mDNS). Best-effort; degrades to relay/manual.
mdns-sd = "0.11"
# QR for `carryall pair` (terminal unicode render only — no image/svg features).
qrcode = { version = "0.14", default-features = false }
# Cross-platform CSPRNG for generating a strong passphrase in `carryall setup`.
getrandom = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland-native clipboard (wlr-data-control).
wl-clipboard-rs = "0.9"
