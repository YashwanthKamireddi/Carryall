[package]
name = "clip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clip — lightweight clipboard daemon + TUI with E2E cross-device sync."

[[bin]]
name = "clip"
path = "src/main.rs"

[dependencies]
clip-core = { workspace = true }
clip-store = { path = "../crates/clip-store" }
clip-sync = { path = "../crates/clip-sync" }
serde_json = { workspace = true }

# Native clipboard read/write + change monitoring (X11/Win/macOS).
clipboard-rs = "0.3"
# TUI
ratatui = "0.29"
crossterm = "0.28"
# async sync client
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
dirs = "5"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland-native clipboard (wlr-data-control).
wl-clipboard-rs = "0.9"
