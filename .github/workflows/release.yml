name: Release

# Build prebuilt binaries for every desktop OS/arch on a version tag, so users
# install without needing Rust. Native runners per arch (no fragile
# cross-compiling). Mirrors the build the CI workflow already proves green.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # lets us dry-run the matrix build without cutting a release

permissions:
  contents: write # upload release assets

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          - { os: macos-13,         target: x86_64-apple-darwin,       name: macos-x86_64 }
          - { os: macos-latest,     target: aarch64-apple-darwin,      name: macos-arm64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - name: Linux clipboard build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p carryall -p carryall-relay

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dist="carryall-${{ matrix.name }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/carryall" "target/${{ matrix.target }}/release/carryall-relay" "$dist/"
          cp README.md LICENSE "$dist/" 2>/dev/null || true
          tar -czf "$dist.tar.gz" "$dist"
          echo "ASSET=$dist.tar.gz" >> "$GITHUB_ENV"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "carryall-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/carryall.exe","target/${{ matrix.target }}/release/carryall-relay.exe" $dist
          Copy-Item README.md,LICENSE $dist -ErrorAction SilentlyContinue
          Compress-Archive -Path $dist -DestinationPath "$dist.zip" -Force
          "ASSET=$dist.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
      - name: Upload as workflow artifact (dry runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: carryall-${{ matrix.name }}
          path: ${{ env.ASSET }}
