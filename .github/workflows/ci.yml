name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps (Wayland for the clipboard backend)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  cross:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: Smoke-run the binary (proves it executes, not just compiles)
        shell: bash
        env:
          # Isolate from any real config; HOME/AppData stay the ephemeral runner's.
          CLIP_DATA_DIR: ${{ runner.temp }}/carryall-smoke
        run: |
          BIN=target/debug/carryall
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/debug/carryall.exe
          "$BIN" --version  # exits 0 (no args would start the daemon and block)
          "$BIN" --help
          "$BIN" setup -y   # generates key, writes config; autostart degrades gracefully
          echo "smoke OK on $RUNNER_OS"

  relay-image:
    name: Relay Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t clip-relay .
