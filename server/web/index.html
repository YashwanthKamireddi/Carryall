<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clip" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" href="/icon.svg" />
    <title>Clip</title>
    <style>
      /* iOS / iPadOS 26 design language (Apple Design Resources). On iPhone the
         SF stack resolves to real San Francisco. */
      :root {
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, system-ui, sans-serif;
        --mono: "SF Mono", ui-monospace, Menlo, monospace;
        --bg: #000; --grouped: #1c1c1e; --grouped-hi: #2c2c2e; --fill: rgba(120,120,128,.24);
        --sep: rgba(84,84,88,.6); --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
        --blue: #0a84ff; --r-group: 12px; --r-field: 11px; --r-icon: 8px;
        --c-text:#8e8e93;--c-link:#0a84ff;--c-color:#ff9f0a;--c-code:#30d158;--c-rich_text:#bf5af2;
        --c-image:#ff375f;--c-files:#5ac8fa;--c-video:#ff453a;--c-audio:#ff9f0a;--c-binary:#8e8e93;
        --spring: cubic-bezier(.32,.72,0,1);
      }
      @media (prefers-color-scheme: light) {
        :root { --bg:#f2f2f7; --grouped:#fff; --grouped-hi:#d1d1d6; --fill:rgba(118,118,128,.12);
          --sep:rgba(60,60,67,.29); --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --blue:#007aff; }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; background: var(--bg); color: var(--label); font-family: var(--font);
        -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; overscroll-behavior: none; }
      body { display: flex; flex-direction: column; height: 100dvh;
        padding: env(safe-area-inset-top) 0 0; }
      .hidden { display: none !important; }

      /* Large-title nav */
      .nav { padding: 6px 20px 8px; display: flex; align-items: flex-end; gap: 10px; }
      .nav h1 { font-size: 34px; font-weight: 700; letter-spacing: .37px; }
      #status { margin-left: auto; margin-bottom: 6px; display: inline-flex; align-items: center; gap: 6px;
        font-size: 13px; color: var(--label2); }
      #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--label3); }
      #status.on .dot { background: #30d158; } #status.connecting .dot { background: #ff9f0a; }

      /* iOS search field */
      #searchbar { padding: 2px 16px 8px; }
      .field { display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 10px;
        background: var(--fill); border-radius: var(--r-field); }
      .field svg { width: 16px; height: 16px; color: var(--label2); flex: 0 0 auto; }
      .field input { flex: 1; background: transparent; border: none; outline: none; color: var(--label);
        font: inherit; font-size: 17px; }
      .field input::placeholder { color: var(--label3); }

      /* Connect (grouped form) */
      #connect { padding: 8px 16px; }
      #connect .blurb { color: var(--label2); font-size: 14px; line-height: 1.5; padding: 4px 4px 14px; }
      #connect .group { background: var(--grouped); border-radius: var(--r-group); overflow: hidden; }
      #connect .group input { width: 100%; border: none; background: transparent; color: var(--label);
        font: inherit; font-size: 17px; padding: 14px 16px; outline: none; }
      #connect .group input:not(:last-child) { border-bottom: .5px solid var(--sep); }
      #connect button { width: 100%; margin-top: 22px; border: none; border-radius: 14px; background: var(--blue);
        color: #fff; font: inherit; font-size: 17px; font-weight: 600; padding: 15px; }
      #connect button:active { opacity: .8; }

      /* Grouped list */
      #list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px calc(12px + env(safe-area-inset-bottom)); }
      #list::-webkit-scrollbar { width: 0; }
      .sec { padding: 16px 6px 7px; font-size: 13px; color: var(--label2); }
      .group { background: var(--grouped); border-radius: var(--r-group); overflow: hidden; margin-bottom: 4px; }
      .empty { text-align: center; color: var(--label3); padding: 70px 24px; font-size: 15px; line-height: 1.5; }
      .cell { position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 14px; min-height: 56px;
        transition: background .15s var(--spring); }
      .cell:active { background: var(--grouped-hi); }
      .cell:not(:last-child)::after { content: ""; position: absolute; left: 58px; right: 0; bottom: 0; height: .5px; background: var(--sep); }
      .leadicon { flex: 0 0 auto; width: 32px; height: 32px; border-radius: var(--r-icon); display: grid; place-items: center; overflow: hidden; }
      .leadicon svg { width: 19px; height: 19px; color: #fff; }
      .leadicon img, .leadicon .swatch { width: 100%; height: 100%; object-fit: cover; }
      .body { flex: 1; min-width: 0; }
      .ptext { font-size: 16px; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ptext.mono { font-family: var(--mono); font-size: 14px; }
      .pmeta { margin-top: 1px; font-size: 13px; color: var(--label2); }
      .pin { flex: 0 0 auto; width: 30px; height: 30px; border: none; background: transparent; color: var(--label3);
        border-radius: 8px; display: grid; place-items: center; }
      .pin svg { width: 18px; height: 18px; }
      .pin.on { color: var(--blue); }

      /* Composer */
      #composer { display: flex; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); border-top: .5px solid var(--sep); }
      #composer input { flex: 1; height: 40px; padding: 0 14px; border-radius: 20px; border: .5px solid var(--sep);
        background: var(--grouped); color: var(--label); font: inherit; font-size: 16px; outline: none; }
      #composer button { width: 40px; height: 40px; border: none; border-radius: 50%; background: var(--blue); color: #fff; font-size: 18px; }

      /* Toast */
      #toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px);
        background: var(--grouped-hi); color: var(--label); padding: 11px 20px; border-radius: 999px; font-size: 14px; font-weight: 500;
        opacity: 0; transition: all .26s var(--spring); pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
  </head>
  <body>
    <div class="nav"><h1>Clipboard</h1><span id="status"><span class="dot"></span><span id="status-text">offline</span></span></div>

    <div id="connect">
      <div class="blurb">Enter the same <b>account</b> and <b>passphrase</b> as your desktop. Clips are end-to-end encrypted — the relay never sees them.</div>
      <div class="group">
        <input id="account" placeholder="Account" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <input id="secret" type="password" placeholder="Passphrase" />
        <input id="relay" placeholder="Relay URL (optional)" autocapitalize="off" autocorrect="off" spellcheck="false" />
      </div>
      <button id="go">Connect</button>
    </div>

    <div id="searchbar" class="hidden">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input id="search" placeholder="Search" autocapitalize="off" autocorrect="off" spellcheck="false" />
      </div>
    </div>

    <div id="list" class="hidden"></div>

    <div id="composer" class="hidden">
      <input id="msg" placeholder="Send to your devices…" />
      <button id="send" aria-label="Send">↑</button>
    </div>

    <div id="toast"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
