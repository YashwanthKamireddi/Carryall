<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clip" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" href="/icon.svg" />
    <title>Clip</title>
    <style>
      /* Onyx — solid, neutral, native-feel. Mirrors the desktop tokens. */
      :root {
        --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        --bg: #0c0c0f; --surface: #16161c; --surface-hi: #20202a;
        --line: rgba(255,255,255,.06); --line-2: rgba(255,255,255,.11);
        --t1: #f3f3f6; --t2: rgba(243,243,246,.6); --t3: rgba(243,243,246,.4); --t4: rgba(243,243,246,.26);
        --accent: #4d7cfe; --sel: rgba(255,255,255,.055); --ok: #34d399;
        --ease: cubic-bezier(.22,1,.36,1); --spring: cubic-bezier(.34,1.4,.5,1);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; background: var(--bg); color: var(--t1); font-family: var(--font);
        -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; overscroll-behavior: none; }
      body { display: flex; flex-direction: column; height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
      .hidden { display: none !important; }

      /* Header */
      header { display: flex; align-items: center; gap: 10px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
      header .logo { width: 22px; height: 22px; }
      header b { font-size: 17px; letter-spacing: -.01em; }
      #status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--t3);
        text-transform: uppercase; letter-spacing: .05em; }
      #status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--t4); }
      #status.on .dot { background: var(--ok); }
      #status.connecting .dot { background: #fbbf24; }

      /* Connect screen */
      #connect { padding: 22px 18px; display: flex; flex-direction: column; gap: 12px; max-width: 460px; width: 100%; }
      #connect p { color: var(--t2); font-size: 13.5px; line-height: 1.55; margin-bottom: 4px; }
      input { font: inherit; font-size: 16px; border-radius: 12px; border: 1px solid var(--line);
        background: var(--surface); color: var(--t1); padding: 14px 14px; outline: none; width: 100%; }
      input:focus { border-color: var(--line-2); }
      input::placeholder { color: var(--t3); }
      button.primary { font: inherit; font-weight: 600; font-size: 15px; border: none; border-radius: 12px;
        background: var(--accent); color: #fff; padding: 14px; cursor: pointer; }
      button.primary:active { opacity: .85; }

      /* Search */
      #searchbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
      #searchbar svg { width: 17px; height: 17px; color: var(--t3); flex: 0 0 auto; }
      #search { border: none; background: transparent; padding: 0; font-size: 16px; }

      /* List */
      #list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); }
      .sec { padding: 13px 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--t4); }
      .empty { color: var(--t3); text-align: center; padding: 60px 24px; font-size: 14px; line-height: 1.5; }
      .row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px;
        transition: background .14s var(--ease), transform .12s var(--ease); }
      .row:active { background: var(--surface); transform: scale(.984); } /* tactile */
      .tile { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 10px; display: grid; place-items: center;
        background: var(--surface); border: 1px solid var(--line); overflow: hidden; color: var(--t2);
        transition: transform .22s var(--spring); }
      .row:active .tile { transform: scale(1.05); }
      .tile svg { width: 20px; height: 20px; }
      .tile img { width: 100%; height: 100%; object-fit: cover; }
      .tile .swatch { width: 100%; height: 100%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.3); }
      .meatball { flex: 1; min-width: 0; }
      .ptext { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ptext.mono { font-family: var(--mono); font-size: 13px; }
      .pmeta { margin-top: 3px; font-size: 11px; color: var(--t3); text-transform: uppercase; letter-spacing: .03em; }
      .pin { flex: 0 0 auto; width: 34px; height: 34px; border: none; background: transparent; color: var(--t4);
        border-radius: 9px; display: grid; place-items: center; }
      .pin svg { width: 17px; height: 17px; }
      .pin.on { color: var(--accent); }

      /* Composer */
      #composer { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
      #composer input { flex: 1; }
      #composer button { font: inherit; font-weight: 600; border: none; border-radius: 12px; background: var(--surface-hi);
        color: var(--t1); padding: 0 18px; cursor: pointer; }

      /* Toast */
      #toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(8px);
        background: #000; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500;
        opacity: 0; transition: all .2s var(--ease); pointer-events: none; border: 1px solid var(--line-2); }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
  </head>
  <body>
    <header>
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="4" width="14" height="17" rx="3" /><path d="M9 4.5h6V7H9z" fill="#3b82f6" stroke="none" />
      </svg>
      <b>Clip</b>
      <span id="status"><span class="dot"></span><span id="status-text">offline</span></span>
    </header>

    <div id="connect">
      <p>Enter the same <b>account</b> and <b>passphrase</b> as your desktop. Clips are end-to-end encrypted — the relay never sees them.</p>
      <input id="account" placeholder="account" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <input id="secret" type="password" placeholder="passphrase" />
      <input id="relay" placeholder="relay url (optional)" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <button class="primary" id="go">Connect</button>
    </div>

    <div id="searchbar" class="hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="search" placeholder="Search your clipboard…" autocapitalize="off" autocorrect="off" spellcheck="false" />
    </div>

    <div id="list" class="hidden"></div>

    <div id="composer" class="hidden">
      <input id="msg" placeholder="Send to your devices…" />
      <button id="send">Send</button>
    </div>

    <div id="toast"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
